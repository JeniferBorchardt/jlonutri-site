  <meta name="description" content="Confirmação de pagamento — JLO Nutri. Combine seu horário pelo WhatsApp." />
  <link rel="icon" href="assets/images/favicon.png?v=7" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QKJYT0FB50"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-QKJYT0FB50");
  </script>
</head>
<body class="thanks-page">
  <main class="thanks">
    <div class="thanks__card">
      <img class="thanks__logo" src="assets/images/jlo-mark.png?v=7" alt="JLO Nutri" width="350" height="234" />
      <p class="eyebrow">Próximo passo</p>
      <h1>Pagamento recebido</h1>
      <p class="thanks__lead">
        Obrigada! Agora vamos combinar o melhor horário pelo WhatsApp. Me chame para alinharmos dia e horário da consulta.
      </p>
      <div class="thanks__actions">
        <a class="btn btn--whats btn--lg" id="thanksWhats" href="#" target="_blank" rel="noopener noreferrer">Combinar horário no WhatsApp</a>
      </div>
      <a class="text-link" href="index.html">Voltar ao site</a>
      <p class="thanks__note">Jenifer Lopes Borchardt · CRN-2 · 13894</p>
    </div>
  </main>
  <script>
    const WHATSAPP_NUMBER = "5553981378527";
    const msg = "Olá, Jenifer! Acabei de pagar pelo site e gostaria de combinar o horário da consulta.";

    window.dataLayer = window.dataLayer || [];
    function track(eventName, params) {
      window.dataLayer.push(Object.assign({ event: eventName }, params || {}));
      if (typeof gtag === "function") gtag("event", eventName, params || {});
    }

    track("compra_concluida", { page: "obrigado" });

    document.getElementById("thanksWhats").href =
      "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
    document.getElementById("thanksWhats").addEventListener("click", function () {
      track("whatsapp_click", { source: "obrigado" });
    });
  </script>
