<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2E241C" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Pagamento recebido · JLO Nutri</title>
  <meta name="description" content="Confirmação de pagamento — JLO Nutri. Combine seu horário pelo WhatsApp." />
  <link rel="canonical" href="https://www.jlonutri.com.br/obrigado" />
  <link rel="icon" href="assets/images/favicon.png?v=8" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=81" />
</head>
<body class="thanks-page">
  <main class="thanks">
    <div class="thanks__card">
      <img class="thanks__logo" src="assets/images/jlo-mark.png?v=8" alt="JLO Nutri" width="350" height="234" decoding="async" />
      <p class="eyebrow">Pagamento confirmado</p>
      <h1>Obrigada! Próximo passo: combinar seu horário</h1>
      <p class="thanks__lead" id="thanksLead">
        Recebi seu pagamento. Me chame no WhatsApp para alinharmos o melhor dia e horário da sua consulta.
      </p>
      <div class="thanks__actions">
        <a class="btn btn--whats btn--lg" id="thanksWhats" href="#" target="_blank" rel="noopener noreferrer">Combinar horário no WhatsApp</a>
      </div>
      <p class="thanks__note">Respondo em horário comercial · Jenifer Lopes Borchardt · CRN-2 · 13894</p>
      <a class="text-link" href="/">Voltar ao site</a>
    </div>
  </main>
  <script>
    (function () {
      var WHATSAPP_NUMBER = "5553981378527";
      var PLAN_LABELS = {
        avulsa: "Individual",
        individual: "Individual",
        trimestral: "Trimestral",
        semestral: "Semestral"
      };

      function track(eventName, params) {
        try {
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push(Object.assign({ event: eventName }, params || {}));
          if (typeof gtag === "function") gtag("event", eventName, params || {});
        } catch (_) {}
      }

      function readPlan() {
        var params = new URLSearchParams(window.location.search);
        var fromQuery = (params.get("plano") || params.get("plan") || "").toLowerCase().trim();
        if (fromQuery && PLAN_LABELS[fromQuery]) {
          return { id: fromQuery, name: PLAN_LABELS[fromQuery] };
        }
        try {
          var raw = localStorage.getItem("jlo_last_plan");
          if (!raw) return null;
          var data = JSON.parse(raw);
          if (!data || !data.name) return null;
          // ignora se tiver mais de 7 dias
          if (data.at && Date.now() - data.at > 7 * 24 * 60 * 60 * 1000) return null;
          return data;
        } catch (_) {
          return null;
        }
      }

      var plan = readPlan();
      var planName = plan && plan.name ? plan.name : "";
      var lead = document.getElementById("thanksLead");
      var msg;

      if (planName) {
        lead.textContent =
          "Recebi o pagamento do plano " +
          planName +
          ". Me chame no WhatsApp para alinharmos o melhor dia e horário da sua consulta.";
        msg =
          "Olá, Jenifer! Acabei de pagar o plano " +
          planName +
          " pelo site e gostaria de combinar o horário da consulta.";
      } else {
        msg =
          "Olá, Jenifer! Acabei de pagar pelo site e gostaria de combinar o horário da consulta.";
      }

      track("compra_concluida", {
        page: "obrigado",
        plan_id: plan && plan.id ? plan.id : undefined,
        plan_name: planName || undefined
      });

      var btn = document.getElementById("thanksWhats");
      btn.href =
        "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
      btn.addEventListener("click", function () {
        track("whatsapp_click", {
          source: "obrigado",
          plan_id: plan && plan.id ? plan.id : undefined
        });
      });
    })();
  </script>
</body>
</html>
